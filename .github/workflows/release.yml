name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v0.4.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          test "$RELEASE_TAG" = "v$version"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@cargo-zigbuild
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: build Linux static executable
        if: runner.os == 'Linux'
        run: cargo zigbuild --locked --release --target ${{ matrix.target }} -p hc-tui
      - name: build macOS executable
        if: runner.os == 'macOS'
        run: cargo build --locked --release --target ${{ matrix.target }} -p hc-tui
      - name: verify native executable
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: |
          target/${{ matrix.target }}/release/hc-tui --version
          target/${{ matrix.target }}/release/hc-tui --default-config > /dev/null
      - name: verify Linux arm64 executable
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
          qemu-aarch64 target/${{ matrix.target }}/release/hc-tui --version
      - name: verify static Linux linkage
        if: runner.os == 'Linux'
        run: file target/${{ matrix.target }}/release/hc-tui | grep -E 'statically linked|static-pie linked'
      - name: package
        run: bash scripts/package-release.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/hc-tui-*.tar.gz*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: require all four archives and checksums
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          cd artifacts
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin; do
            archive="hc-tui-$version-$target.tar.gz"
            test -s "$archive"
            sha256sum -c "$archive.sha256"
          done
      - name: include one-command installer
        run: |
          sh -n install.sh
          python3 scripts/test-install.py
          cp install.sh artifacts/install.sh
          cd artifacts
          sha256sum install.sh > install.sh.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: CHANGELOG.md
