[workspace]
resolver = "2"
members = ["crates/ghostty-vt"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[package]
name = "hc-tui"
version = "0.4.3"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A terminal workbench for coding agents, built on herdr-core"

[lib]
name = "hc_tui"
path = "src/lib.rs"

[[bin]]
name = "hc-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = "0.28"
ghostty-vt = { path = "crates/ghostty-vt" }
png = "0.17"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-width = "0.2"
