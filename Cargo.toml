[workspace]
resolver = "2"
members = ["crates/ghostty-vt"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[package]
name = "hc-tui"
version = "0.4.3"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A terminal workbench for coding agents, built on herdr-core"

[lib]
name = "hc_tui"
path = "src/lib.rs"

[[bin]]
name = "hc-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = "0.29"
ghostty-vt = { path = "crates/ghostty-vt" }
libc = "0.2"
crossbeam-channel = "0.5"
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "951556dc1af6f5acf593cfd28640a0fd467b71e3", default-features = false, features = ["js"] }
nsh-package = { git = "https://github.com/longbridge/nsh", rev = "951556dc1af6f5acf593cfd28640a0fd467b71e3", default-features = false }
nsh-platform-tui = { git = "https://github.com/longbridge/nsh", rev = "951556dc1af6f5acf593cfd28640a0fd467b71e3", default-features = false, features = ["js"] }
png = "0.17"
ratatui = "0.30.2"
ratatui-core = "0.1.2"
ratatui-crossterm = "0.1.2"
ratatui-widgets = "0.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "time", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-width = "0.2"

[dev-dependencies]
nsh-bundler = { git = "https://github.com/longbridge/nsh", rev = "951556dc1af6f5acf593cfd28640a0fd467b71e3", default-features = false }
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "951556dc1af6f5acf593cfd28640a0fd467b71e3", default-features = false }

# --- disk/compile tuning (added 2026-11-07) ---
# 自己的 crate 保留行号表（够 panic backtrace），依赖完全不生成调试符号。
# 依据实测：单 crate debug 产物 792M，strip 后 116M（85% 是 DWARF）。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
