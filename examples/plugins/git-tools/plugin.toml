manifest_version = 1
id = "dev.hctui.plugins.git-tools"
name = "Git tools"
version = "0.1.0"
host_api = 1
platforms = ["linux", "macos"]
description = "Space 的 Git 摘要与远端 lazygit 入口"

[[actions]]
id = "summary"
title = "Git 摘要"
description = "在当前 Space 的机器上读取 Git 分支与改动"
contexts = ["global", "space", "pane"]
argv = ["sh", "./bin/summary.sh"]
timeout_ms = 15000

[actions.args]
type = "object"
properties = { short = { type = "boolean", default = true } }
additionalProperties = false

[[terminals]]
id = "git-ui"
title = "Git UI"
argv = ["lazygit"]
placement = "right"
requires_programs = ["lazygit"]
